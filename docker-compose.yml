# Optional: run RRMC/blob experiments in Docker
# Usage:
#   export OPENROUTER_API_KEY=sk-or-v1-...
#   docker compose run --rm rrmc python run.py blob/blob_dc_gaussian --n_train 5 --n_test 3
# Or with .env file:
#   docker compose run --rm rrmc python run.py blob/blob_dc_gaussian --n_train 5 --n_test 3

services:
  rrmc:
    build: .
    image: rrmc:blob
    env_file: .env
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    volumes:
      - ./results:/app/results
      - ./AR-Bench:/app/AR-Bench
    working_dir: /app
    # Override default CMD when running: docker compose run rrmc python run.py ...
    command: ["python", "run.py", "--list"]
