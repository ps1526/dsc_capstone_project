# Blob Experiment: DC with Gaussian Noise
experiment_name: blob/blob_dc_gaussian
task: dc
regime: normal
data_subset: test

# Perturbation settings
perturbation:
  enabled: true
  noise_type: gaussian
  noise_scale: 0.1
  n_perturbed_samples: 8
  temperature_range: [0.3, 1.2]
  use_prompt_perturbation: true
  use_embedding_noise: true

# Combined uncertainty
combined_uncertainty:
  use_ece: true
  alpha: 0.5  # MI weight
  beta: 0.5   # ECE weight
  ece_bins: 10

# Question selection
use_ece_question_selector: false  # Start with baseline
ece_question_selector:
  m_candidates: 5
  r_simulations: 3
  score_type: combined  # mi, ece, or combined

# Calibration
calibrate: true
n_train: 30
n_test: 20
target_error: 0.10

# Methods to compare
methods:
  - fixed_turns
  - robust_mi
  - perturbed_mi_ece
  - ece_only

# MI estimation
k_samples: 8
variants:
  - base
  - skeptical
