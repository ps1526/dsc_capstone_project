# Blob Experiment: GN with Gaussian Noise (Diagnostic)
experiment_name: blob/blob_gn_gaussian
task: gn
regime: normal
data_subset: test

# Perturbation settings
perturbation:
  enabled: true
  noise_type: gaussian
  noise_scale: 0.1
  n_perturbed_samples: 8
  temperature_range: [0.3, 1.2]
  use_prompt_perturbation: true
  use_embedding_noise: true

# Combined uncertainty
combined_uncertainty:
  use_ece: true
  alpha: 0.5
  beta: 0.5
  ece_bins: 10

# Question selection
use_ece_question_selector: false

# No calibration for GN (diagnostic only)
calibrate: false
n_puzzles: 20
max_turns: 15

# Methods to compare
methods:
  - fixed_turns
  - perturbed_mi_ece
  - ece_only

# MI estimation
k_samples: 8
