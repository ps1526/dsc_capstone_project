# Perturbed MI+ECE Method Configuration
method_name: perturbed_mi_ece

# Stopping threshold (can be calibrated)
threshold: 0.3

# Sampling
k_samples: 8
temperature: 0.7

# Prompt variants for MI
variants:
  - base
  - skeptical

# MI and ECE weights
alpha: 0.5  # MI weight
beta: 0.5   # ECE weight

# ECE parameters
ece_bins: 10

# Perturbation
perturbation:
  noise_type: gaussian
  noise_scale: 0.1
  temperature_range: [0.3, 1.2]
  use_prompt_perturbation: true
  use_embedding_noise: true

# Decoding regime
regime: normal
